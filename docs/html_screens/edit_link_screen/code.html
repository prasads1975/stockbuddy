<body class="flex flex-col min-h-screen">
<!-- Top Status Bar (Hardware Status) -->

<!-- Top AppBar -->
<header class="w-full top-0 sticky z-50 bg-surface dark:bg-surface-container-highest border-b border-border-subtle dark:border-outline-variant flex items-center px-margin-mobile h-14">
<button class="mr-4 active:scale-95 duration-100 transition-colors hover:bg-surface-container-high p-2 rounded-full">

</button>
<h1 class="font-headline-page text-headline-page-mobile md:text-headline-page text-primary truncate">Edit Linked Item</h1>
</header><div class="px-margin-mobile py-2 bg-surface-container-low flex items-center border-b border-border-subtle">
<div class="flex items-center gap-2 w-full">
<span class="material-symbols-outlined text-status-available text-[16px]">sensors</span>
<span class="font-label-caption text-label-caption text-on-surface-variant font-bold tracking-widest uppercase">READER CONNECTED</span>
<div class="flex-grow"></div>

</div>
</div>
<!-- Main Form Content -->
<main class="flex-1 overflow-y-auto px-margin-mobile pt-6 pb-32">
<div class="space-y-6 max-w-lg mx-auto">
<!-- RFID Tag ID Field (Mandatory) -->
<div class="space-y-2">
<label class="block font-label-cta text-on-surface-variant">
                    Barcode / EAN <span class="text-error">*</span>
</label>
<div class="relative flex items-center">
<input class="input-rugged pr-12 font-body-data bg-surface-container-low" placeholder="Scan or enter barcode" type="text" value="6901234567890" readonly="readonly">

</div>
</div><div class="space-y-2">
<label class="block font-label-cta text-on-surface-variant">
                    RFID Tag ID <span class="text-error">*</span>
</label>
<div class="relative flex items-center"><div class="flex gap-2 w-full">
<div class="relative flex-1">
<input class="input-rugged font-body-data" placeholder="Scan or enter RFID" type="text" value="RFID_TAG_9921_X">
</div>
<button class="h-14 w-14 flex items-center justify-center bg-secondary-container text-on-secondary-container rounded-lg active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined">sensors</span>
</button>
</div></div>
<p class="text-[12px] text-on-surface-variant">Last scanned 2 minutes ago</p>
</div>
<!-- Article ID Field (Mandatory) -->
<div class="space-y-2">


</div>
<!-- Product Name Field (Mandatory) -->
<div class="space-y-2">
<label class="block font-label-cta text-on-surface-variant">
                    Product Name <span class="text-error">*</span>
</label>
<input class="input-rugged font-body-data bg-surface-container-low" placeholder="Enter full product name" type="text" value="Ultra-Light Running Shoes" readonly="readonly">
</div>
<!-- Barcode / EAN Field (Mandatory) -->

<!-- Category Field (Mandatory) -->

<label class="block font-label-cta text-on-surface-variant">
                    Category <span class="text-error">*</span>
</label>
<div class="relative">
<select class="input-rugged font-body-data appearance-none bg-surface-container-low" disabled="disabled">
<option selected="" value="footwear">Footwear</option>
<option value="apparel">Apparel</option>
<option value="accessories">Accessories</option>
<option value="equipment">Equipment</option>
</select>

</div>
</div>
<!-- Status Awareness Info Card (Rugged Style) -->

</div>
</main>
<!-- Fixed Bottom Action Container -->
<div class="fixed bottom-0 left-0 right-0 p-4 bg-surface border-t border-border-subtle flex flex-col gap-3 md:hidden z-40">
<button class="thumb-zone-action w-full bg-primary text-white font-label-cta flex items-center justify-center gap-2 rounded-lg active:scale-[0.98] transition-transform shadow-sm"><span class="material-symbols-outlined text-[20px]" style="font-variation-settings: &quot;FILL&quot; 1;">link</span> UPDATE LINK</button>

<div class="h-2"></div>
</div>
<!-- Desktop Version of the same button (Centered in a narrow container) -->
<div class="hidden md:flex fixed bottom-8 left-1/2 -translate-x-1/2 w-full max-w-lg px-margin-mobile">
<button class="thumb-zone-action w-full bg-primary text-white font-label-cta flex items-center justify-center gap-2 rounded-lg active:scale-[0.98] transition-transform shadow-lg"><span class="material-symbols-outlined text-[20px]" style="font-variation-settings: &quot;FILL&quot; 1;">link</span> UPDATE LINK</button>
</div>
<script>
        // Simple micro-interaction for scan buttons
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function() {
                const icon = this.querySelector('.material-symbols-outlined');
                if(icon && (icon.innerText === 'broadcast_on_personal' || icon.innerText === 'barcode_scanner')) {
                    const originalColor = icon.style.color;
                    icon.style.color = '#F9A825'; // Hardware activation color
                    setTimeout(() => {
                        icon.style.color = originalColor;
                    }, 600);
                }
            });
        });

        // Prevention of accidental navigation on primary action
        document.querySelector('.thumb-zone-action').addEventListener('click', (e) => {
            console.log('Update Asset Triggered');
            // Mock feedback
            const btn = e.currentTarget;
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> SAVING...';
            btn.disabled = true;
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> UPDATED';
                btn.classList.replace('bg-primary', 'bg-status-available');
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.classList.replace('bg-status-available', 'bg-primary');
                    btn.disabled = false;
                }, 1500);
            }, 800);
        });
    </script>
