                    "on-error": "#ffffff",
                    "inverse-on-surface": "#f1f0f3",
                    "secondary-container": "#c9e2fd",

                    "tertiary-fixed": "#ffddb0",

<style>
        body {
            background-color: #faf9fc;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            min-height: max(884px, 100dvh);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .shimmer {
            background: linear-gradient(90deg, #1b3a57 0%, #446180 50%, #1b3a57 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .logo-bounce {
            animation: softBounce 3s ease-in-out infinite;
        }
        @keyframes softBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-margin-mobile bg-background">
<!-- Splash Screen Container -->
<main class="flex flex-col items-center justify-between w-full max-w-md h-[707px]">
<!-- Top Spacer for centering the logo vertically in the visual field -->
<div class="h-12"></div>
<!-- Center Identity Section -->
<div class="flex flex-col items-center text-center">
<!-- Brand Logo -->
<div class="mb-8 logo-bounce">
<div class="w-24 h-24 bg-primary rounded-xl flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-white text-5xl" style="font-variation-settings: 'FILL' 1;">sensors</span>
</div>
</div>
<!-- Brand Name & Subtitle -->
<div class="space-y-1">
<h1 class="font-headline-page text-headline-page text-primary tracking-tight">StockBuddy RFID</h1>
<p class="font-label-cta text-label-cta text-on-surface-variant tracking-widest uppercase opacity-80">Enterprise Asset Tracking</p>
</div>
</div>
<!-- Bottom Loading & Branding Section -->
<div class="w-full space-y-12 flex flex-col items-center">
<!-- Progress Feedback Area (Thumb-Zone Optimization) -->
<div class="w-full max-w-xs space-y-4">
<div class="flex justify-between items-end mb-1 px-1">
<span class="font-label-caption text-label-caption text-on-surface-variant">Initializing Hardware &amp; Middleware...</span>
<span class="font-label-caption text-label-caption font-bold text-primary" id="progress-percent">49%</span>
</div>
<!-- Progress Bar Track -->
<div class="w-full h-2 bg-surface-container-high rounded-full overflow-hidden">
<!-- Progress Bar Fill -->
<div class="h-full w-[49%] bg-primary rounded-full shimmer transition-all duration-1000 ease-out" id="progress-bar"></div>
</div>
<!-- Manual Entry for Preview -->
<div class="pt-4 flex justify-center">
<button class="px-6 py-2 bg-primary text-on-primary font-label-cta rounded-full shadow-md active:scale-95 transition-transform flex items-center gap-2" onclick="window.location.href = '{{DATA:SCREEN:SCREEN_18}}'">
<span>Enter App</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</div>
<!-- Corporate Branding Footer -->
<div class="flex flex-col items-center space-y-1 opacity-60">
<p class="font-label-caption text-label-caption text-on-surface-variant">Powered by</p>
<div class="flex items-center gap-2">
<div class="w-4 h-4 bg-on-surface-variant rounded-sm flex items-center justify-center">
<span class="material-symbols-outlined text-[10px] text-white">bolt</span>
</div>
<span class="font-label-cta text-label-cta text-on-surface text-[12px]">GIGAKIN</span>
</div>
<p class="font-label-caption text-[10px] text-on-surface-variant">www.gigakin.com</p>
</div>
</div>
</main>
<script>
        // Static visual maintenance for the preview tool.
        // Redirection logic is disabled per request to allow manual testing and screenshot capture.
        document.addEventListener('DOMContentLoaded', () => {
            const progressBar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-percent');
            
            // Slow visual pulse for the progress bar without finishing or redirecting
            let progress = 49;
            setInterval(() => {
                if (progress < 85) {
                    progress += Math.random() * 0.5;
                    progressBar.style.width = `${progress}%`;
                    progressText.innerText = `${Math.round(progress)}%`;
                }
            }, 2000);
        });
    </script>
</body></html>
