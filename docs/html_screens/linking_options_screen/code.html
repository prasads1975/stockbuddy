<style>
    body {
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .active-state {
      transition: transform 0.15s ease-out, opacity 0.15s ease-out;
    }
    .active-state:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
    .thumb-optimized-grid {
      display: grid;
      grid-template-rows: 1fr auto;
      height: calc(100vh - 56px - 80px);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface-industrial text-on-surface antialiased flex flex-col min-h-screen">
<!-- TopAppBar (From JSON) -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center px-4 h-14 bg-transparent">
<div class="flex items-center gap-4 w-full">
<button class="text-on-surface active:opacity-80 transition-colors" onclick="window.location.href = '{{DATA:SCREEN:SCREEN_18}}'">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-page text-headline-page font-bold text-on-surface">Linking</h1>
</div>
</header>
<!-- Hardware Status (Design System Mandate) -->
<div class="mt-14 px-4 py-1 flex items-center border-b border-border-subtle bg-surface-container-low">
<div class="flex items-center gap-2 w-full">
<span class="material-symbols-outlined text-status-available text-[16px]" data-icon="sensors">sensors</span>
<span class="font-label-caption text-label-caption text-on-surface-variant font-bold tracking-wider">READER CONNECTED</span>
</div>
</div>
<!-- Main Content Canvas -->
<main class="flex-grow px-4 pt-4 overflow-y-auto pb-6">
<div class="mb-6">
<h2 class="font-title-card text-title-card text-on-surface opacity-70 mb-2">Select Operation Mode</h2>
<p class="font-body-metadata text-body-metadata text-on-surface-variant">Choose how you want to associate assets with the digital inventory system.</p>
</div>
<!-- Linking Options Grid (Bento/Card Style) -->
<div class="grid grid-cols-1 gap-4 thumb-zone"><button class="active-state flex items-center gap-4 w-full bg-surface-container-lowest border border-border-subtle p-4 rounded-lg shadow-sm hover:border-primary transition-all group" onclick="window.location.href = '#'">
<div class="p-3 bg-primary/5 rounded-lg group-hover:bg-primary transition-colors">
<span class="material-symbols-outlined text-primary group-hover:text-on-primary text-[24px]" data-icon="qr_code_scanner">qr_code_scanner</span>
</div>
<div class="flex-grow">
<h3 class="font-title-card text-title-card font-bold text-on-surface">QR Code Linking</h3>
<p class="font-body-metadata text-body-metadata text-on-surface-variant">Instantly link items by scanning warehouse-generated QR labels.</p>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Option 1: Individual Linking -->
<button class="active-state flex items-center gap-4 w-full bg-surface-container-lowest border border-border-subtle p-4 rounded-lg shadow-sm hover:border-primary transition-all group" onclick="window.location.href = '{{DATA:SCREEN:SCREEN_11}}'">
<div class="p-3 bg-primary/5 rounded-lg group-hover:bg-primary transition-colors">
<span class="material-symbols-outlined text-primary group-hover:text-on-primary text-[24px]" data-icon="add_box">add_box</span>
</div>
<div class="flex-grow">
<h3 class="font-title-card text-title-card font-bold text-on-surface">Manual Linking</h3>
<p class="font-body-metadata text-body-metadata text-on-surface-variant">Scan or manually link a single item.</p>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Option 2: Bulk Linking -->
<button class="active-state flex items-center gap-4 w-full bg-surface-container-lowest border border-border-subtle p-4 rounded-lg shadow-sm hover:border-primary transition-all group" onclick="window.location.href = '{{DATA:SCREEN:SCREEN_6}}'">
<div class="p-3 bg-secondary/5 rounded-lg group-hover:bg-secondary transition-colors">
<span class="material-symbols-outlined text-secondary group-hover:text-on-secondary text-[24px]" data-icon="upload_file">upload_file</span>
</div>
<div class="flex-grow">
<h3 class="font-title-card text-title-card font-bold text-on-surface">Bulk Linking</h3>
<p class="font-body-metadata text-body-metadata text-on-surface-variant">Import multiple items via CSV or RFID.</p>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-secondary" data-icon="chevron_right">chevron_right</span>
</button>
</div>
<!-- Informational Card -->
<div class="mt-12 p-4 bg-surface-container rounded-lg flex items-center gap-4">
<span class="material-symbols-outlined text-outline" data-icon="info">info</span>
<p class="font-body-metadata text-body-metadata text-on-surface-variant">
        Need help? Check the <span class="text-primary font-semibold underline decoration-2 underline-offset-4">Hardware Guide</span> for scanner calibration tips.
      </p>
</div>
</main>
<!-- BottomNavBar (From JSON) -->
<!-- Micro-interaction Script -->
<script>
    document.querySelectorAll('.active-state').forEach(button => {
      button.addEventListener('touchstart', function() {
        this.classList.add('bg-surface-container-high');
      });
      button.addEventListener('touchend', function() {
        this.classList.remove('bg-surface-container-high');
      });
    });
  </script>








</body></html>
