<style>
        .material-symbols-outlined {

<body class="bg-background text-on-surface font-body-data selection:bg-secondary-container">
<!-- Top Navigation Bar -->
<header class="w-full top-0 sticky z-40 bg-surface border-b border-border-subtle flex items-center px-margin-mobile h-14">
<div class="flex items-center gap-4 w-full">
<button class="material-symbols-outlined text-on-surface-variant hover:bg-surface-container-high transition-colors p-2 rounded-full active:scale-95 duration-100" onclick="window.location.href = '{{DATA:SCREEN:SCREEN_18}}'">
                arrow_back
            </button>
<h1 class="font-headline-page text-headline-page-mobile text-primary">Inventory Scan</h1>
</div>
</header>
<!-- Hardware Status Bar (Persistent/Slim) -->
<div class="bg-surface-container-lowest border-b border-border-subtle px-4 py-1.5 flex items-center justify-between">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[16px] text-status-available">sensors</span>
<span class="font-label-caption text-label-caption text-on-surface-variant uppercase tracking-wider">Reader Connected</span>
</div>
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[14px] text-on-surface-variant">battery_charging_full</span>
<span class="font-label-caption text-label-caption text-on-surface-variant">88%</span>
</div>
</div>
<main class="flex flex-col min-h-[calc(100vh-112px)] pb-32">
<!-- Session Identity & Filter -->
<section class="p-margin-mobile flex flex-col gap-4">
<div class="flex justify-between items-end">
<div>
<span class="font-label-caption text-label-caption text-on-surface-variant block uppercase mb-1">Session Code</span>
<h2 class="font-title-card text-title-card text-on-surface">3 June Morning</h2>
</div>
<div class="relative min-w-[120px]">
<span class="font-label-caption text-label-caption text-on-surface-variant block uppercase mb-1">Category</span>
<button class="w-full flex items-center justify-between bg-surface-container-high px-3 py-2 rounded-lg text-on-surface-variant">
<span class="font-body-metadata text-body-metadata">All</span>
<span class="material-symbols-outlined">expand_more</span>
</button>
</div>
</div>
</section>
<!-- Real-time Unique Tag Counter (Bento Style) -->
<section class="px-margin-mobile flex flex-col gap-stack-gap">
<div class="relative bg-primary-container text-on-primary-container rounded-xl p-8 flex flex-col items-center justify-center overflow-hidden h-48 border border-primary/20">
<!-- Atmospheric background element -->
<div class="absolute -right-8 -top-8 w-32 h-32 bg-primary/10 rounded-full blur-3xl"></div>
<div class="absolute -left-8 -bottom-8 w-32 h-32 bg-secondary-container/20 rounded-full blur-3xl"></div>

<div class="relative z-10 flex items-baseline gap-2">
<span class="font-display-count text-display-count text-white scale-100" id="tag-counter">0</span>
<span class="material-symbols-outlined text-primary-fixed-dim scanning-active" style="font-variation-settings: &quot;FILL&quot; 1;">sensors</span>
</div>
<!-- Scanning Progress Visualizer -->

</div>
<!-- Recent Activity/Log -->

</section>
</main>
<!-- Scanning Overlay / Visualization Placeholder -->

<!-- Primary Action Panel (Thumb-Zone) -->
<div class="fixed bottom-0 w-full bg-surface-container-lowest p-margin-mobile border-t border-border-subtle z-50">
<button class="w-full h-14 bg-status-available text-on-error rounded-xl font-label-cta text-[16px] uppercase tracking-widest flex items-center justify-center gap-3 active:scale-95 transition-all shadow-lg active:shadow-none" onclick="window.location.href = '{{DATA:SCREEN:SCREEN_15}}'">
<span class="material-symbols-outlined" style="font-variation-settings: &quot;FILL&quot; 1;">play_arrow</span>
            START SCANNING
        </button>
</div>
<!-- Bottom Nav Shell (For Contextual Navigation) - Suppressed as per Task-Focused/Linear logic in prompt instructions, but here is the BottomNavBar structure if required by specific system logic. In this "Focused Scanning" state, we prioritize the STOP action. -->
<script>
        // Micro-interaction for the counter
        let count = 42;
        const counterEl = document.getElementById('tag-counter');
        
        setInterval(() => {
            if (Math.random() > 0.7) {
                count += Math.floor(Math.random() * 3) + 1;
                counterEl.innerText = count;
                counterEl.classList.remove('scale-100');
                counterEl.classList.add('scale-110');
                setTimeout(() => {
                    counterEl.classList.remove('scale-110');
                    counterEl.classList.add('scale-100');
                }, 150);
            }
        }, 1200);

        // Simple hardware status toggle simulation
        document.querySelector('.uppercase.tracking-wider').addEventListener('click', function() {
            const dot = this.previousElementSibling;
            if (dot.classList.contains('bg-status-available')) {
                dot.classList.replace('bg-status-available', 'bg-status-missing');
                this.innerText = 'Reader Disconnected';
            } else {
                dot.classList.replace('bg-status-missing', 'bg-status-available');
                this.innerText = 'Reader Connected';
            }
        });
    </script>
<style>
        @keyframes progress {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
