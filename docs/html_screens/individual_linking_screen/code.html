<script>
        // Micro-interactions
        const scanTrigger = document.getElementById('scan-trigger');
        const rfidContainer = document.getElementById('rfid-scan-container');
        const rfidValue = document.getElementById('rfid-value');
        const scanIndicator = document.getElementById('scan-indicator');

        let isScanning = false;

        scanTrigger.addEventListener('click', () => {
            if (isScanning) return;
            
            isScanning = true;
            scanTrigger.innerText = 'SCANNING...';
            scanTrigger.classList.add('opacity-70');
            rfidContainer.classList.add('bg-secondary-container/20');
            rfidContainer.classList.add('border-primary');
            
            // Simulating a real RFID read
            setTimeout(() => {
                const mockID = "E280" + Math.random().toString(16).substr(2, 16).toUpperCase();
                rfidValue.innerText = mockID;
                rfidValue.classList.add('text-status-available');
                
                scanTrigger.innerText = 'RE-SCAN TAG';
                scanTrigger.classList.remove('opacity-70');
                rfidContainer.classList.remove('bg-secondary-container/20');
                rfidContainer.classList.add('bg-status-available/5');
                
                isScanning = false;

                // Feedback
                if (window.navigator.vibrate) {
                    window.navigator.vibrate(50);
                }
            }, 1500);
        });

        // Form submission prevention for demo
        document.getElementById('linking-form').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Linking association saved successfully!');
        });
    </script>


















<div id="toast-container" class="fixed top-20 left-1/2 -translate-x-1/2 z-[100] pointer-events-none flex flex-col gap-3 w-full max-w-[340px] px-4"></div><script>
function showToast(message, type) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  const bgColor = type === 'success' ? 'bg-status-available' : 'bg-error';
  const icon = type === 'success' ? 'check_circle' : 'error';
  
  toast.className = `${bgColor} text-white p-4 rounded-xl shadow-2xl flex items-center gap-3 toast-animate border border-white/20`;
  toast.innerHTML = `
    <span class="material-symbols-outlined">${icon}</span>
    <span class="font-label-cta">${message}</span>
  `;
  
  container.appendChild(toast);
  
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transition = 'opacity 0.5s ease';
    setTimeout(() => toast.remove(), 500);
  }, 3000);
}

function handleSaveLink(event) {
  event.preventDefault();
  const form = document.getElementById('linking-form');
  const inputs = form.querySelectorAll('input[required], select[required]');
  let isValid = true;

  inputs.forEach(input => {
    if (!input.value || input.value === '') {
      isValid = false;
    }
  });

  if (isValid) {
    showToast('Link saved successfully', 'success');
    // Optional: form.reset();
  } else {
    showToast('Failed to save link. Please check mandatory fields.', 'error');
  }
}
