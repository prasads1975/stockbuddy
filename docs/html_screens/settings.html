<script>
        // Micro-interaction for the hardware indicator
        document.querySelector('.bg-status-available').addEventListener('click', () => {
            const el = document.querySelector('.bg-status-available');
            el.classList.add('scale-[1.02]');
            setTimeout(() => el.classList.remove('scale-[1.02]'), 200);
