        // Simple animation logic for the viewfinder
        const viewfinder = document.querySelector('.corner-bracket');
        let scale = 1;
        let growing = true;
        
        function pulse() {
            const brackets = document.querySelectorAll('.corner-bracket');
            if (growing) {
                scale += 0.005;
                if (scale >= 1.05) growing = false;
            } else {
                scale -= 0.005;
                if (scale <= 0.95) growing = true;
            }

            });

        }
