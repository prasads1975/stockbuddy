<script>
        document.addEventListener('DOMContentLoaded', () => {
            const progressBar = document.getElementById('progress-bar');
            const statusText = document.getElementById('loading-status');
            const percentText = document.getElementById('loading-percentage');
            
            const statuses = [
                "Initializing Hardware...",
                "Activating RFID Module...",
                "Connecting to SQL Middleware...",
                "Syncing Local Manifest...",
                "Readying Industrial Interface..."
            ];

            let progress = 0;
            const duration = 3000;
            const intervalTime = 50;
            const steps = duration / intervalTime;
            const increment = 100 / steps;

            const timer = setInterval(() => {
                progress += increment;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(timer);
                    setTimeout(() => {
                        window.location.href = "{{DATA:SCREEN:SCREEN_13}}";
                    }, 200);
                }
                
                progressBar.style.width = `${progress}%`;
                percentText.innerText = `${Math.floor(progress)}%`;

                const statusIndex = Math.min(
                    Math.floor((progress / 100) * statuses.length),
                    statuses.length - 1
                );
                statusText.innerText = statuses[statusIndex];
            }, intervalTime);
        });
    </script>
