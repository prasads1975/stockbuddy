<body class="bg-surface-industrial text-on-surface antialiased flex flex-col min-h-screen">
<!-- Top App Bar (Header) -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center px-4 h-14 bg-transparent">
<div class="flex items-center gap-4 w-full">
<button class="text-on-surface active:opacity-80 transition-colors" onclick="window.location.href='{{DATA:SCREEN:SCREEN_13}}'">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-page text-headline-page font-bold text-on-surface">Bulk Linking</h1>
</div>
</header>
<!-- Hardware Status Bar -->
<div class="mt-14 px-margin-mobile py-2 bg-surface-container-low flex items-center border-b border-border-subtle">
<div class="flex items-center gap-2 w-full">
<span class="material-symbols-outlined text-status-available text-[16px]">sensors</span>
<span class="font-label-caption text-label-caption text-on-surface-variant font-bold tracking-widest uppercase">READER CONNECTED</span>
<div class="flex-grow"></div>
</div>
</div>
<!-- Main Content Canvas -->
<main class="flex-grow p-margin-mobile flex flex-col gap-6">
<!-- Upload Zone -->
<section class="flex flex-col gap-4">
<label class="cursor-pointer" for="csv-upload">
<div class="industrial-border bg-surface-container-low rounded-xl border-dashed border-2 border-outline-variant p-8 flex flex-col items-center justify-center text-center gap-3 active:bg-surface-container transition-colors min-h-[200px]">
<div class="w-16 h-16 rounded-full bg-primary-fixed flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary-fixed-variant text-[32px]">upload_file</span>
</div>
<div class="flex flex-col gap-1">
<span class="font-title-card text-title-card text-on-surface">Select CSV File</span>
<span class="font-body-metadata text-body-metadata text-on-surface-variant">Tap to browse or drag &amp; drop</span>
</div>
</div>
<input accept=".csv" class="hidden" id="csv-upload" type="file">
</label>
</section>
<!-- Schema Preview / Guidance Area -->
<section class="flex flex-col gap-4">
<div class="flex items-center justify-between">
<h2 class="font-title-card text-title-card text-primary uppercase tracking-tight">Expected CSV Schema</h2>

</div>
<div class="industrial-border rounded-lg overflow-hidden bg-white shadow-sm">
<div class="grid grid-cols-2 bg-surface-container-high p-3 border-b border-border-subtle">
<span class="font-label-caption text-label-caption text-on-surface-variant uppercase">COLUMN NAME</span>
<span class="font-label-caption text-label-caption text-on-surface-variant uppercase">EXAMPLE</span>
</div>
<div class="divide-y divide-border-subtle"><!-- Row 1 -->
<div class="grid grid-cols-2 p-3 bg-surface-container-lowest items-center">
<span class="font-body-metadata text-body-metadata text-on-surface truncate pr-2">Product Name</span>
<span class="font-body-metadata text-body-metadata text-on-surface truncate">Rugged Smartphone</span>
</div>
<!-- Row 2 -->
<div class="grid grid-cols-2 p-3 bg-surface-container-lowest items-center">
<span class="font-body-metadata text-body-metadata text-on-surface truncate pr-2">Barcode</span>
<span class="font-body-metadata text-body-metadata text-on-surface truncate">88291022</span>
</div>
<!-- Row 3 -->
<div class="grid grid-cols-2 p-3 bg-surface-container-lowest items-center">
<span class="font-body-metadata text-body-metadata text-on-surface truncate pr-2">Category</span>
<span class="font-body-metadata text-body-metadata text-on-surface truncate">Accessory</span>
</div>
<!-- Row 4 -->
<div class="grid grid-cols-2 p-3 bg-surface-container-lowest items-center">
<span class="font-body-metadata text-body-metadata text-on-surface truncate pr-2">RFID ID</span>
<span class="font-body-metadata text-body-metadata text-on-surface truncate">E28011912...</span>
</div></div>
</div>
<div class="flex gap-3 p-3 bg-surface-container-low rounded-lg">
<span class="material-symbols-outlined text-primary text-[20px]">info</span>

</div>

<span class="material-symbols-outlined text-[20px]">cloud_upload</span>
                Import Data
            </button>

</section>
</main>
<!-- Bottom Navigation (Shared Component) -->
<script>
        // Simple micro-interaction for file input simulation
        const fileInput = document.getElementById('csv-upload');
        const importBtn = document.getElementById('import-btn');

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                const fileName = e.target.files[0].name;
                const uploadZoneTitle = document.querySelector('.font-title-card');
                const uploadZoneMeta = document.querySelector('.font-body-metadata');
                
                uploadZoneTitle.innerText = fileName;
                uploadZoneTitle.classList.add('text-status-available');
                uploadZoneMeta.innerText = "File ready for import";
                
                importBtn.disabled = false;
                importBtn.classList.remove('disabled:bg-surface-variant', 'disabled:text-on-surface-variant');
            }
        });

        // Tactile feedback simulation
        importBtn.addEventListener('click', () => {
            if(!importBtn.disabled) {
                importBtn.innerHTML = '<span class="animate-spin material-symbols-outlined">sync</span> Processing...';
                setTimeout(() => {
                    alert("Import simulation complete. Data mapped to StockBuddy database.");
                    importBtn.innerHTML = '<span class="material-symbols-outlined text-[20px]">cloud_upload</span> Import Data';
                }, 2000);
            }
        });
    </script>
