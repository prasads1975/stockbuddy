<script>
        // Simple tab switching interaction
        const tabs = document.querySelectorAll('[role="tab"], button.flex-1');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => {
                    t.classList.remove('border-primary', 'text-primary', 'border-b-2');
                    t.classList.add('text-on-surface-variant');
                });
                tab.classList.add('border-primary', 'text-primary', 'border-b-2');
                tab.classList.remove('text-on-surface-variant');
            });
        });
    </script>
