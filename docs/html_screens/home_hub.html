<script>
        // Simple micro-interaction for the hardware status bar
        document.addEventListener('DOMContentLoaded', () => {
            const statusBar = document.querySelector('.fixed.bottom-20');
            // Mock connection animation
            setTimeout(() => {
                statusBar.classList.remove('animate-pulse');
            }, 3000);
        });
    </script>








<div id="inventory-modal" class="fixed inset-0 z-[100] items-center justify-center p-4 flex hidden">

    </div>
